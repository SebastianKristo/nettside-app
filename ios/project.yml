name: CloudflareAnalytics
options:
  bundleIdPrefix: no.kristo
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: nb
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CloudflareAnalytics:
    type: application
    platform: iOS
    sources:
      - path: CloudflareAnalytics
      - path: ../shared/queries
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.cfanalytics
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cloudflare Analytics
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: CloudflareAnalytics/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [no.kristo.cfanalytics.refresh]
        CFBundleDevelopmentRegion: nb
